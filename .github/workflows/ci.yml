name: Validate contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run compile
      - run: npm run compile:seadrop
      - run: npm test
      - run: node --check cosmic-kin-studio/public/app.js && node --check cosmic-kin-studio/public/public-mint.js && node --check cosmic-kin-studio/public/experience.js && node --check cosmic-kin-studio/local-studio.mjs
      - run: npm run test:serverless
      - run: npm run build
      - run: npm run test:mint
